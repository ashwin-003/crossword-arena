project_id = "crossword-arena"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true
# CROSSWORD ARENA has no password complexity requirements — any password the
# player supplies must be accepted (still hashed by Supabase Auth, never
# stored or exposed as plaintext). Setting the floor to 1 satisfies that
# while keeping Supabase's own secure hashing in place.
minimum_password_length = 1

[auth.email]
enable_signup = true
# Players never see or use email; registration happens through the
# register Edge Function with the service role, so confirmation emails
# would just be noise (and there is no real inbox behind the synthetic
# address). Confirmation is skipped for the same reason a magic-link flow
# would be pointless here.
enable_confirmations = false

[realtime]
enabled = true

[edge_runtime]
enabled = true

[functions.get-review]
verify_jwt = false

